name: Validate manifests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check version and MCP endpoint consistency
        run: python3 scripts/check-manifests.py
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Pinned so a new validator release can't fail CI without a change here;
      # bump it when upgrading. Checks the marketplace and the plugin manifest.
      - name: Validate Claude plugin
        run: |
          npx -y @anthropic-ai/claude-code@2.1.296 plugin validate . --strict
          npx -y @anthropic-ai/claude-code@2.1.296 plugin validate .claude-plugin/plugin.json --strict
